name: Signed Windows draft
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: semaforo-production-signing
  cancel-in-progress: false
jobs:
  signed:
    # Never schedule pull request code on this machine. Configure environment
    # reviewers and deployment branch rules allowing only protected main.
    if: github.ref == 'refs/heads/main' && github.repository == 'CarrotHuerta/Semaforo_ql'
    environment: windows-production-signing
    runs-on: [self-hosted, Windows, X64, semaforo-signing]
    timeout-minutes: 90
    env:
      SIGNTOOL_PATH: ${{ vars.SIGNTOOL_PATH }}
      SIGN_CERT_SHA1: ${{ vars.SIGN_CERT_SHA1 }}
      SIGN_CERT_SHA256: ${{ vars.SIGN_CERT_SHA256 }}
      SIGN_EXPECTED_SUBJECT: ${{ vars.SIGN_EXPECTED_SUBJECT }}
      SIGN_TIMESTAMP_URL: ${{ vars.SIGN_TIMESTAMP_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and sign using the preprovisioned hardware-backed certificate
        id: product
        shell: powershell
        run: |
          ./scripts/Initialize-Build.ps1
          ./scripts/Install-InnoSetup.ps1
          ./scripts/Build-Windows.ps1 -Channel Production
          $version = (Get-Content -Raw product.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          $zip = (Get-ChildItem "artifacts/production/$version/*-portable.zip").FullName
          ./scripts/Test-Bundle.ps1 -Zip $zip -Production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-production
          path: artifacts/production/${{ steps.product.outputs.version }}/*
          if-no-files-found: error
          retention-days: 30
  draft:
    needs: signed
    environment: windows-release-draft
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: signed-production
          path: artifacts/production
      - name: Create draft only (never publish)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $product = Get-Content -Raw product.json | ConvertFrom-Json
          $tag = 'v' + $product.version
          ./scripts/Test-Checksums.ps1 -Directory artifacts/production -Production
          # Fail if this version exists; never overwrite a published release.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release/version already exists.' }
          $assets = @(Get-ChildItem artifacts/production -File | ForEach-Object FullName)
          gh release create $tag @assets --draft --target '${{ github.sha }}' --title "Semáforo IA $($product.version)" --notes-file docs/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed.' }
